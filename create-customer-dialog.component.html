<form [formGroup]="formGroup" class="p-8">
  <h1 class="mb-3">{{ data() !== null ? 'Kunden editieren' : 'Kunden anlegen' }}</h1>
  <div class="flex gap-6">
    <mat-form-field>
      <mat-label>{{ 'Name' }}</mat-label>
      <input [formControl]="formGroup.controls.name" matInput type="text">
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'Nachname' }}</mat-label>
      <input [formControl]="formGroup.controls.surname" matInput type="text">
    </mat-form-field>
  </div>

  <mat-form-field>
    <mat-label>{{ 'E-Mail' }}</mat-label>
    <input [formControl]="formGroup.controls.email" matInput type="text">
  </mat-form-field>

  <div class="flex gap-6">
    <mat-form-field>
      <mat-label>{{ 'PLZ' }}</mat-label>
      <input [formControl]="formGroup.controls.zipCode" matInput type="number">
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'Stadt' }}</mat-label>
      <input [formControl]="formGroup.controls.city" matInput type="text">
    </mat-form-field>
  </div>

  <div class="flex gap-6">
    <mat-form-field>
      <mat-label>{{ 'Straße' }}</mat-label>
      <input [formControl]="formGroup.controls.street" matInput type="text">
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'Hausnummer' }}</mat-label>
      <input [formControl]="formGroup.controls.houseNumber" matInput type="text">
    </mat-form-field>
  </div>
  <div class="flex justify-around mb-3">
    <button (click)="onSave()" [disabled]="formGroup.invalid" mat-raised-button>{{ 'Save' }}</button>
    <button (click)="onCancel()" mat-flat-button>{{ 'Cancel' }}</button>
  </div>
</form>
